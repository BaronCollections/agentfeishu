[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfeishu"
version = "0.1.0"
description = "Feishu-controlled Codex agent framework with extensible business capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "BaronCollections" }
]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]
keywords = ["feishu", "codex", "agent", "automation", "capabilities"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
url-ingest = [
  "yt-dlp>=2025.1.1",
  "gallery-dl>=1.27.0",
  "trafilatura>=2.0.0",
  "playwright>=1.45.0",
  "beautifulsoup4>=4.12.0",
  "pillow>=10.0.0",
]
url-ingest-vision = [
  "agentfeishu[url-ingest]",
  "rapidocr-onnxruntime>=1.3.0",
  "faster-whisper>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
agentfeishu = "agentfeishu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q"
